<header class="site-header" role="banner">
  {%- if site.title -%}
    <!-- AJOUT DE TON IMAGE ICI -->
    <div style="text-align: center; margin-bottom: 15px;">
      <a href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/images/logo_CNRS.png' | relative_url }}" alt="Logo" style="max-width: 50px; height: auto;">
      </a>
    </div>

    <!-- CODE ORIGINAL DE MINIMA (NE PAS MODIFIER) -->
    <h1 class="site-title">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </h1>
  {%- endif -%}

  {%- if site.header_pages -%}
    <nav class="site-nav">
      <ul>
        {%- for page in site.header_pages -%}
          <li><a href="{{ page.url | relative_url }}">{{ page.title }}</a></li>
        {%- endfor -%}
      </ul>
    </nav>
  {%- endif -%}
</header>
