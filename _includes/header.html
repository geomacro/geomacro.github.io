<header class="site-header" role="banner">
  <!-- Structure de base de Minima -->
  {%- if site.title or site.header_pages -%}
    <div class="wrapper" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;">

      <!-- LOGO À GAUCHE -->
      <div style="flex: 0 0 auto; margin-right: 20px;">
        <a href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/images/logo_logo.png' | relative_url }}" alt="Logo CNRS" style="height: 50px;">
        </a>
      </div>

      <!-- TITRE AU CENTRE -->
      <div style="flex: 1; text-align: center;">
        {%- if site.title -%}
          <h1 class="site-title" style="margin: 0;">
            <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
          </h1>
        {%- endif -%}
      </div>

      <!-- MENU À DROITE -->
      <div style="flex: 0 0 auto;">
        {%- if site.header_pages -%}
          <nav class="site-nav">
            <ul style="display: flex; gap: 20px; list-style: none; padding: 0; margin: 0;">
              {%- for page in site.header_pages -%}
                <li><a href="{{ page.url | relative_url }}">{{ page.title }}</a></li>
              {%- endfor -%}
            </ul>
          </nav>
        {%- endif -%}
      </div>
    </div>
  {%- endif -%}
</header>
