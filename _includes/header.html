<header class="site-header" role="banner" style="padding: 15px 20px; border-bottom: 1px solid #333; background: white;">
  <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; max-width: 1200px; margin: 0 auto;">

    <!-- LOGO CNRS À GAUCHE -->
    <div style="flex: 0 0 auto;">
      <a href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/images/logo_cnrs.png' | relative_url }}" alt="Logo CNRS" style="height: 50px; width: auto;">
      </a>
    </div>

    <!-- TITRE AU CENTRE -->
    <div style="flex: 1; text-align: center;">
      <h1 class="site-title" style="margin: 0; font-size: 1.5em; font-weight: 500; color: #333;">
        <a href="{{ '/' | relative_url }}" style="color: inherit; text-decoration: none;">
          Réseau Thématique GeoMacro
        </a>
      </h1>
    </div>

    <!-- MENU À DROITE -->
    <div style="flex: 0 0 auto;">
      <nav class="site-nav">
        <ul style="list-style: none; padding: 0; margin: 0; display: flex; gap: 20px;">
          {% for page in site.header_pages %}
            <li>
              <a href="{{ page.url | relative_url }}" style="text-decoration: none; color: #333; font-weight: 500;">
                {{ page.title }}
              </a>
            </li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</header>
