<header class="site-header" role="banner">
  <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 15px 20px; max-width: 1200px; margin: 0 auto;">
    <!-- LOGO À GAUCHE -->
    <div style="flex: 0 0 auto;">
      <a href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/images/logo_cnrs.png' | relative_url }}" alt="Logo" style="height: 40px; width: auto;">
      </a>
    </div>

    <!-- TITRE AU CENTRE -->
    <div style="flex: 1; text-align: center;">
      <h1 class="site-title" style="margin: 0; font-size: 1.5em;">
        <a href="{{ '/' | relative_url }}" style="color: inherit; text-decoration: none;">{{ site.title }}</a>
      </h1>
    </div>

    <!-- MENU À DROITE -->
    <nav class="site-nav" style="flex: 0 0 auto;">
      <ul style="list-style: none; padding: 0; margin: 0; display: flex; gap: 15px;">
        {% for page in site.header_pages %}
          <li><a href="{{ page.url | relative_url }}" style="text-decoration: none; color: inherit;">{{ page.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
