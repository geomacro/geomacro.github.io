<header class="site-header" role="banner">
  <!-- Image dans le header -->
  <div style="text-align: center; margin-bottom: 20px;">
    <a href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo_cnrs.png' | relative_url }}" alt="Logo" style="max-width: 30px; height: auto;">
    </a>
  </div>

  <!-- Navigation (menu) -->
  <nav class="site-nav">
    <h1 class="site-nav__title">
      <a href="{{ '/' | relative_url }}">{{ site.title | default: site.github.repository_name }}</a>
    </h1>
    <ul class="nav-list">
      {% for page in site.header_pages %}
        <li><a href="{{ page.url | relative_url }}">{{ page.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
