<header class="site-header" role="banner">
  {%- if site.title or site.header_pages -%}
    <div class="wrapper">
      <!-- AJOUT DE TON LOGO ICI -->
      <div style="text-align: center; margin: 0 0 15px 0;">
        <a href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/images/logo_cnrs.png' | relative_url }}" alt="Logo" style="max-width: 50px; height: auto;">
        </a>
      </div>

      <!-- CODE ORIGINAL DE MINIMA (NE PAS MODIFIER) -->
      {%- if site.title -%}
        <h1 class="site-title">
          <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
        </h1>
      {%- endif -%}

      {%- if site.header_pages -%}
        <nav class="site-nav">
          <ul>
            {%- for page in site.header_pages -%}
              <li><a href="{{ page.url | relative_url }}">{{ page.title }}</a></li>
            {%- endfor -%}
          </ul>
        </nav>
      {%- endif -%}
    </div>
  {%- endif -%}
</header>
