<header class="site-header" role="banner">
  <div style="display: flex; align-items: center; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; padding: 1em 0;">

    <!-- LOGO À GAUCHE -->
    <div style="flex: 0 0 auto; margin-right: 1em;">
      <a href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/images/logo_cnrs.png' | relative_url }}" alt="Logo" style="height: 40px; width: auto;">
      </a>
    </div>

    <!-- TITRE + MENU (structure originale de Minima) -->
    <div style="flex: 1; display: flex; flex-direction: column;">
      {% if site.title %}
        <h1 class="site-title" style="margin: 0; font-size: 1.5em;">
          <a href="{{ '/' | relative_url }}" style="color: inherit; text-decoration: none;">{{ site.title }}</a>
        </h1>
      {% endif %}

      {% if site.header_pages %}
        <nav class="site-nav" style="margin-top: 0.5em;">
          <ul style="list-style: none; padding: 0; margin: 0; display: flex; gap: 1em; flex-wrap: wrap;">
            {% for page in site.header_pages %}
              <li><a href="{{ page.url | relative_url }}">{{ page.title }}</a></li>
            {% endfor %}
          </ul>
        </nav>
      {% endif %}
    </div>
  </div>
</header>
